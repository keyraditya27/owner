<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARL Keuangan Internal — Arah Ruang Langit</title>
<style>
  :root{
    --navy:#0A2540;--sky:#1B6FE3;--horizon:#4FA3F7;--green:#0FB88F;
    --cream:#F5F7FA;--line:#E3E9F0;--muted:#6B7C93;--amber:#F5A623;--red:#E5484D;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Calibri','Segoe UI',Arial,sans-serif;background:#EEF2F7;color:var(--navy);line-height:1.55}
  .num{font-variant-numeric:tabular-nums}
  button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:13.5px;color:var(--navy);background:#fff;
    border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--sky);outline-offset:-1px;border-color:var(--sky)}
  a{color:var(--sky)}

  /* ---------- shell ---------- */
  .app{display:grid;grid-template-columns:230px minmax(0,1fr) 380px;min-height:100vh}
  aside{background:linear-gradient(160deg,var(--navy) 0%,#0d2c4d 60%,#123a63 100%);color:#fff;
        display:flex;flex-direction:column;padding:24px 16px}
  .logo-wrap{display:flex;align-items:center;gap:11px;padding:0 6px 6px}
  .logo-mark{flex:0 0 auto;display:block;line-height:0}
  .logo-mark img{height:56px;width:auto;object-fit:contain;display:block}
  .logo-txt{font-family:Cambria,Georgia,serif;font-size:14.5px;font-weight:700;letter-spacing:.5px;line-height:1.25}
  .logo-txt span{color:var(--horizon)}
  .logo-sub{font-size:10.5px;letter-spacing:1.4px;color:#8FB5DE;font-weight:700;margin-top:3px}
  .hash{margin:14px 6px 20px;font-size:11px;color:var(--green);font-weight:700;letter-spacing:1.4px}
  nav{display:flex;flex-direction:column;gap:3px}
  nav button{color:#C3D8EF;text-align:left;padding:10px 12px;border-radius:8px;
             display:flex;align-items:center;gap:10px;font-size:13.5px}
  nav button svg{width:15px;height:15px;fill:currentColor;flex:0 0 15px;opacity:.85}
  nav button:hover{background:rgba(255,255,255,.09);color:#fff}
  nav button[aria-current="true"]{background:#fff;color:var(--navy);font-weight:700}
  nav .tag{margin-left:auto;font-size:10.5px;background:var(--red);color:#fff;border-radius:12px;padding:1px 8px;font-weight:700}
  .aside-foot{margin-top:auto;padding:16px 6px 0;border-top:1px solid rgba(255,255,255,.14);
              display:flex;flex-direction:column;gap:5px}
  .aside-foot button{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);color:#D6E5F5;
                     border-radius:7px;padding:7px 10px;text-align:left;font-size:12px}
  .aside-foot button:hover{background:rgba(255,255,255,.15);color:#fff}
  .aside-foot .who{font-size:11px;color:#7FA0C4;padding-top:8px}

  main{background:#EEF2F7;padding:22px;overflow-x:hidden}
  .page{max-width:1100px;margin:0 auto;background:#fff;border-radius:16px;overflow:hidden;
        box-shadow:0 8px 32px rgba(10,37,64,.10)}
  .hero{background:linear-gradient(135deg,var(--navy) 0%,#123a63 55%,var(--sky) 140%);color:#fff;padding:30px 36px}
  .hero-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
  .hero-brand{display:flex;align-items:center;gap:11px;font-family:Cambria,Georgia,serif;
              font-size:17px;font-weight:700;letter-spacing:.5px}
  .hero-brand img{height:40px;width:auto;display:block}
  .badge{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);padding:6px 14px;
         border-radius:20px;font-size:12px}
  h1{font-family:Cambria,Georgia,serif;font-size:27px;margin-top:16px;font-weight:700}
  .sub{color:#BBD4F2;font-size:13.5px;margin-top:6px}
  .hero-actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}

  section{padding:28px 36px;border-bottom:1px solid var(--line)}
  section:last-child{border-bottom:0}
  .sec-title{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .ic{width:34px;height:34px;border-radius:50%;background:var(--sky);display:flex;align-items:center;
      justify-content:center;flex:0 0 34px}
  .ic svg{width:17px;height:17px;fill:#fff}
  .ic.green{background:var(--green)} .ic.amber{background:var(--amber)} .ic.red{background:var(--red)}
  h2{font-family:Cambria,Georgia,serif;font-size:19px}
  .sec-desc{color:var(--muted);font-size:13px;margin:0 0 18px 46px}
  .sec-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .kpi{background:var(--cream);border:1px solid var(--line);border-top:3px solid var(--sky);
       border-radius:10px;padding:16px}
  .kpi.hl{border-top-color:var(--green);background:#F0FBF8}
  .kpi.bad{border-top-color:var(--red);background:#FEF3F3}
  .kpi.warn{border-top-color:var(--amber);background:#FEF8EE}
  .kpi .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:700}
  .kpi .val{font-size:20px;font-weight:700;margin-top:6px;font-family:Cambria,Georgia,serif}
  .kpi .note{font-size:11.5px;color:var(--muted);margin-top:3px}
  .up{color:var(--green);font-weight:700}.dn{color:var(--red);font-weight:700}

  table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
  thead th{background:var(--navy);color:#fff;padding:10px 8px;text-align:left;font-size:11px;
           text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
  thead th.r,td.r{text-align:right}
  tbody td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
  tbody tr:nth-child(even){background:#FAFCFE}
  tfoot td{background:#EDF3FB;font-weight:700;padding:10px 8px;border-top:2px solid var(--navy)}
  .name{font-weight:600}
  .cell-sub{font-size:11.5px;color:var(--muted);font-weight:400}

  .pill{display:inline-block;padding:2px 9px;border-radius:12px;font-size:10.5px;font-weight:700;
        color:#fff;white-space:nowrap}
  .p-green{background:var(--green)}.p-sky{background:var(--sky)}.p-amber{background:var(--amber)}
  .p-red{background:var(--red)}.p-gray{background:var(--muted)}.p-navy{background:var(--navy)}

  .ins{border-left:4px solid var(--sky);background:var(--cream);border-radius:0 10px 10px 0;
       padding:14px 18px;margin-bottom:12px}
  .ins.good{border-left-color:var(--green);background:#F0FBF8}
  .ins.warn{border-left-color:var(--amber);background:#FEF8EE}
  .ins.bad{border-left-color:var(--red);background:#FEF3F3}
  .ins h4{font-size:14px;margin-bottom:3px;font-family:Cambria,Georgia,serif}
  .ins p{font-size:13px;color:#3D4F63}

  .btn{background:var(--sky);color:#fff;border-radius:8px;padding:9px 15px;font-weight:700;font-size:13px}
  .btn:hover{background:#1560CC}
  .btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
  .btn.ghost:hover{background:var(--cream);border-color:#C9D8EA}
  .btn.on-hero{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff}
  .btn.on-hero:hover{background:rgba(255,255,255,.24)}
  .btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}
  .btn.danger{background:#fff;color:var(--red);border:1px solid #F3CDCE}
  .btn.green{background:var(--green)}.btn.green:hover{background:#0CA37E}

  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 14px 46px}
  .filters select,.filters input{width:auto;min-width:135px;padding:7px 9px;font-size:12.5px}
  .bukti{width:32px;height:32px;border-radius:6px;object-fit:cover;border:1px solid var(--line);cursor:zoom-in;display:block}
  .bukti-none{width:32px;height:32px;border-radius:6px;border:1px dashed #CFDAE7;display:flex;
              align-items:center;justify-content:center;color:#A9BACD;font-size:10px;font-weight:700}
  .empty{padding:30px 16px;text-align:center;color:var(--muted);font-size:13px;
         background:var(--cream);border:1px dashed var(--line);border-radius:10px}
  .empty b{display:block;color:var(--navy);font-size:14px;margin-bottom:4px;font-family:Cambria,Georgia,serif}

  .bar-row{margin-bottom:11px}
  .bar-top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px}
  .bar{height:8px;background:#E7EDF5;border-radius:6px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--sky);border-radius:6px}
  .bar i.g{background:var(--green)} .bar i.r{background:var(--red)}

  .klien-card{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:16px}
  .klien-head{background:var(--cream);padding:14px 16px;display:flex;justify-content:space-between;
              gap:12px;align-items:flex-start;flex-wrap:wrap;border-bottom:1px solid var(--line)}
  .klien-head h4{font-family:Cambria,Georgia,serif;font-size:15.5px}
  .klien-head .meta{font-size:12px;color:var(--muted);margin-top:2px}
  .klien-card table{margin-top:0}
  .klien-card thead th{background:#12395F}

  /* ---------- chat ---------- */
  .chat{background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column;
        height:100vh;position:sticky;top:0}
  .chat-head{background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;
             justify-content:space-between;gap:10px}
  .chat-head b{font-family:Cambria,Georgia,serif;font-size:14.5px}
  .chat-head .st{font-size:11.5px;color:#A9C6E6;display:flex;align-items:center;gap:6px;margin-top:2px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
  .dot.off{background:var(--amber)}
  .chat-log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:11px;background:#F7FAFD}
  .msg{max-width:92%;font-size:13px}
  .msg.me{align-self:flex-end;background:var(--navy);color:#fff;padding:9px 12px;border-radius:12px 12px 3px 12px}
  .msg.ai{align-self:flex-start;background:#fff;border:1px solid var(--line);padding:9px 12px;
          border-radius:12px 12px 12px 3px;white-space:pre-wrap;color:#3D4F63}
  .msg.me img{max-width:150px;border-radius:8px;margin-top:7px;display:block}
  .rec{align-self:stretch;background:#fff;border:1px solid var(--line);border-top:3px solid var(--sky);
       border-radius:10px;padding:13px 14px;font-size:12.5px}
  .rec.masuk{border-top-color:var(--green)} .rec.keluar{border-top-color:var(--red)}
  .rec-top{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:10px}
  .rec-top b{font-family:Cambria,Georgia,serif;font-size:18px}
  .rec-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .rec-grid label{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;
                  font-weight:700;display:block;margin-bottom:3px}
  .rec-grid input,.rec-grid select{padding:6px 8px;font-size:12.5px}
  .rec-foot{display:flex;justify-content:space-between;align-items:center;margin-top:11px;gap:8px;flex-wrap:wrap}
  .rec-foot .ok{font-size:11px;color:var(--green);font-weight:700}
  .chat-compose{border-top:1px solid var(--line);padding:12px;background:#fff}
  .chat-attach{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:8px}
  .chat-attach img{width:36px;height:36px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
  .chat-attach button{color:var(--red);font-size:12px;font-weight:700}
  .compose-row{display:flex;gap:8px;align-items:flex-end}
  .compose-row textarea{resize:none;min-height:42px;max-height:120px;border-radius:9px;font-size:13px}
  .icon-btn{background:#fff;border:1px solid var(--line);border-radius:9px;width:42px;height:42px;
            display:flex;align-items:center;justify-content:center;flex:0 0 42px}
  .icon-btn svg{width:17px;height:17px;fill:var(--navy)}
  .icon-btn:hover{background:var(--cream)}
  .icon-btn.send{background:var(--sky);border-color:var(--sky)} .icon-btn.send svg{fill:#fff}
  .icon-btn.send:hover{background:#1560CC}
  .chat-tips{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
  .chat-tips button{background:var(--cream);border:1px solid var(--line);border-radius:20px;
                    padding:4px 10px;font-size:11.5px;color:var(--muted)}
  .chat-tips button:hover{background:#E7F0FB;color:var(--navy)}

  /* ---------- modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(10,37,64,.6);display:none;place-items:center;padding:24px;z-index:60}
  .overlay.on{display:grid}
  .modal{background:#fff;border-radius:14px;max-width:600px;width:100%;max-height:88vh;overflow-y:auto}
  .modal-head{background:var(--navy);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;
              align-items:center;gap:10px}
  .modal-head h3{font-family:Cambria,Georgia,serif;font-size:16px}
  .modal-head .close{color:#A9C6E6;font-size:22px;line-height:1}
  .modal-body{padding:20px}
  .modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;
              gap:8px;flex-wrap:wrap}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
  .form-grid .full{grid-column:1/-1}
  .form-grid label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;
                   font-weight:700;display:block;margin-bottom:4px}
  .zoom img{max-width:100%;border-radius:10px;display:block}
  .wa-box{background:var(--cream);border:1px solid var(--line);border-radius:10px;padding:13px;
          white-space:pre-wrap;font-size:13px;line-height:1.6}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;
         padding:11px 18px;border-radius:9px;font-size:13px;z-index:80;opacity:0;pointer-events:none;
         transition:opacity .2s;box-shadow:0 6px 20px rgba(10,37,64,.3)}
  .toast.on{opacity:1}
  footer{background:var(--navy);color:#9FBEDD;padding:20px 36px;font-size:12px;display:flex;
         justify-content:space-between;flex-wrap:wrap;gap:8px}
  footer b{color:#fff}
  .hidden{display:none!important}

  @media(max-width:1240px){.app{grid-template-columns:200px minmax(0,1fr) 330px}}
  @media(max-width:1080px){
    .app{grid-template-columns:1fr}
    aside{flex-direction:row;align-items:center;gap:14px;padding:12px 16px;overflow-x:auto}
    .hash,.aside-foot{display:none}
    nav{flex-direction:row}
    .chat{height:80vh;border-left:0;border-top:1px solid var(--line);position:static}
    .kpis{grid-template-columns:repeat(2,1fr)}
    section{padding:22px 18px}.hero{padding:24px 18px}
    .sec-desc,.filters{margin-left:0}
    main{padding:12px}
  }

  .periodbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
             padding:12px 36px;background:#F8FAFD;border-bottom:1px solid var(--line)}
  .seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .seg button{padding:7px 15px;font-size:12.5px;color:var(--muted);font-weight:600;
              border-right:1px solid var(--line)}
  .seg button:last-child{border-right:0}
  .seg button:hover{background:var(--cream);color:var(--navy)}
  .seg button.on{background:var(--navy);color:#fff}
  .pnav{display:flex;align-items:center;gap:6px}
  .pnav button{width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:8px;
               color:var(--navy);font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center}
  .pnav button:hover{background:var(--cream)}
  .pnav button.kini{width:auto;padding:0 12px;font-size:12px;font-weight:600}
  .pnav select{width:auto;min-width:150px;padding:6px 10px;font-size:13px;font-weight:600;
               font-family:Cambria,Georgia,serif}
  .subtabs{display:flex;gap:4px;padding:0 36px;background:#fff;border-bottom:1px solid var(--line);
           overflow-x:auto;scrollbar-width:none}
  .subtabs::-webkit-scrollbar{display:none}
  .subtabs button{padding:13px 15px;font-size:13px;font-weight:600;color:var(--muted);
                  border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:6px}
  .subtabs button:hover{color:var(--navy)}
  .subtabs button.on{color:var(--navy);border-bottom-color:var(--sky)}
  .subtabs .bdg{background:var(--red);color:#fff;font-size:10.5px;font-weight:700;
                border-radius:10px;padding:1px 7px;line-height:1.5}
  .subtabs button.on .bdg{background:var(--red)}
  @media(max-width:1080px){.periodbar{padding:10px 18px}.subtabs{padding:0 18px}}
  @media(max-width:900px){.neraca-grid{grid-template-columns:1fr!important}}
  @media(max-width:620px){.kpis{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <!-- ================= SIDEBAR ================= -->
  <aside>
    <div class="logo-wrap">
      <span class="logo-mark" id="logoSlot"></span>
      <span>
        <span class="logo-txt">ARAH RUANG<br><span>LANGIT</span></span>
        <div class="logo-sub">KEUANGAN INTERNAL</div>
      </span>
    </div>
    <div class="hash">#ZeroToHero</div>
    <nav id="nav">
      <button data-view="dashboard" aria-current="true">
        <svg viewBox="0 0 24 24"><path d="M3 13h4v8H3v-8zm7-9h4v17h-4V4zm7 5h4v12h-4V9z"/></svg>Ringkasan</button>
      <button data-view="transaksi">
        <svg viewBox="0 0 24 24"><path d="M4 5h16v3H4V5zm0 5h16v3H4v-3zm0 5h10v3H4v-3z"/></svg>Transaksi</button>
      <button data-view="klien">
        <svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 100-8 4 4 0 000 8zm0 2c-4 0-8 2-8 5v1h16v-1c0-3-4-5-8-5z"/></svg>Klien &amp; Tagihan
        <span class="tag hidden" id="navTag">0</span></button>
      <button data-view="aset">
        <svg viewBox="0 0 24 24"><path d="M3 6h15a3 3 0 013 3v9a3 3 0 01-3 3H3V6zm14 6a2 2 0 100 4 2 2 0 000-4zM3 3h12v2H3V3z"/></svg>Aset &amp; Inventaris</button>
      <button data-view="pajak">
        <svg viewBox="0 0 24 24"><path d="M12 22a2 2 0 002-2h-4a2 2 0 002 2zm6-6V11a6 6 0 10-12 0v5l-2 2v1h16v-1l-2-2z"/></svg>Pajak
        <span class="tag hidden" id="navTagPajak">0</span></button>
      <button data-view="laporan">
        <svg viewBox="0 0 24 24"><path d="M5 3h9l5 5v13H5V3zm8 1.5V9h4.5L13 4.5zM7 12h10v2H7v-2zm0 4h10v2H7v-2z"/></svg>Laporan</button>
    </nav>
    <div class="aside-foot">
      <button onclick="formAI()">Pengaturan AI</button>
      <button onclick="formPerusahaan()">Profil perusahaan</button>
      <button id="btnLogo">Ganti logo</button>
      <button id="btnLogoReset">Pakai logo resmi ARL</button>
      <button id="btnExport">Unduh data (JSON)</button>
      <button id="btnImport">Muat data</button>
      <button id="btnSeed">Isi contoh data</button>
      <button id="btnReset">Kosongkan semua</button>
      <div class="who">Arah Ruang Langit · Bandung</div>
    </div>
  </aside>

  <!-- ================= MAIN ================= -->
  <main><div class="page" id="page"></div></main>

  <!-- ================= CHAT ================= -->
  <section class="chat">
    <div class="chat-head">
      <div>
        <b>Catat lewat chat</b>
        <div class="st"><span class="dot" id="aiDot"></span><span id="aiStatus">Bukti dibaca otomatis</span></div>
      </div>
      <span style="display:flex;gap:6px">
        <button class="btn on-hero sm" onclick="formAI()">Pengaturan AI</button>
        <button class="btn on-hero sm" id="btnClearChat">Bersihkan</button></span>
    </div>
    <div class="chat-log" id="chatLog"></div>
    <div class="chat-compose">
      <div class="chat-attach hidden" id="attachRow">
        <img id="attachThumb" alt="Bukti">
        <span id="attachName"></span>
        <button id="attachRemove">Hapus</button>
      </div>
      <div class="compose-row">
        <button class="icon-btn" id="btnAttach" title="Lampirkan bukti">
          <svg viewBox="0 0 24 24"><path d="M11 11V5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg></button>
        <textarea id="chatInput" rows="1" placeholder="Contoh: bayar iklan meta Batik Ayman 750rb"></textarea>
        <button class="icon-btn send" id="btnSend" title="Kirim">
          <svg viewBox="0 0 24 24"><path d="M12 4l7 7h-4v9h-6v-9H5l7-7z"/></svg></button>
      </div>

/* ---------------- util ---------------- */
const uid=()=>Math.random().toString(36).slice(2,10);
const todayISO=()=>new Date().toISOString().slice(0,10);
const rp=n=>'Rp '+(Math.round(n||0)).toLocaleString('id-ID');
const rpS=n=>{n=Math.round(n||0);const a=Math.abs(n),s=n<0?'−':'';
  if(a>=1e9)return s+'Rp '+(a/1e9).toFixed(a%1e9?1:0)+' M';
  if(a>=1e6)return s+'Rp '+(a/1e6).toFixed(a%1e6?1:0)+' jt';
  if(a>=1e3)return s+'Rp '+Math.round(a/1e3)+' rb'; return s+'Rp '+a;};
const tgl=i=>i?new Date(i+'T00:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}):'—';
const bulanLabel=ym=>{const[y,m]=ym.split('-');return new Date(y,m-1,1).toLocaleDateString('id-ID',{month:'long',year:'numeric'});};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hariSelisih=i=>Math.floor((new Date(i+'T00:00:00')-new Date(todayISO()+'T00:00:00'))/864e5);
const pct=(a,b)=>!b?null:((a-b)/b*100);

/* ---------------- derived ---------------- */
const saldo=()=>state.transaksi.reduce((s,t)=>s+(t.tipe==='masuk'?t.nominal:-t.nominal),0);
const bulanIni=()=>todayISO().slice(0,7);
const bulanLalu=()=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-1);return d.toISOString().slice(0,7);};
const trxBulan=ym=>state.transaksi.filter(t=>(t.tanggal||'').startsWith(ym));
const totalTipe=(a,t)=>a.filter(x=>x.tipe===t).reduce((s,x)=>s+x.nominal,0);
function tagihanTerbuka(){const o=[];state.klien.forEach(k=>(k.tagihan||[]).forEach(i=>{
  const s=i.nominal-(i.dibayar||0); if(s>0)o.push({...i,sisa:s,klienId:k.id,klien:k.nama,wa:k.wa,pic:k.pic,paket:k.paket});}));
  return o.sort((a,b)=>(a.jatuhTempo||'').localeCompare(b.jatuhTempo||''));}
const totalPiutang=()=>tagihanTerbuka().reduce((s,i)=>s+i.sisa,0);
const telat=()=>tagihanTerbuka().filter(i=>hariSelisih(i.jatuhTempo)<0);
function statusInv(i){const s=i.nominal-(i.dibayar||0);
  if(s<=0)return{c:'p-green',t:'Lunas'};
  const d=hariSelisih(i.jatuhTempo);
  if(d<0)return{c:'p-red',t:'Telat '+Math.abs(d)+' hari'};
  if((i.dibayar||0)>0)return{c:'p-amber',t:'Dibayar sebagian'};
  if(d<=3)return{c:'p-amber',t:d===0?'Jatuh tempo hari ini':'H-'+d};
  return{c:'p-sky',t:'Belum jatuh tempo'};}

/* =========================================================
   PARSER OFFLINE
   ========================================================= */
function parseNominal(text){const t=text.toLowerCase().replace(/rp\.?/g,' ');
  let m=t.match(/(\d+(?:[.,]\d+)?)\s*(jt|juta|m|miliar)\b/);
  if(m)return Math.round(parseFloat(m[1].replace(',','.'))*(/(m|miliar)/.test(m[2])?1e9:1e6));
  m=t.match(/(\d+(?:[.,]\d+)?)\s*(rb|ribu|k)\b/);
  if(m)return Math.round(parseFloat(m[1].replace(',','.'))*1e3);
  m=t.match(/(\d{1,3}(?:[.,]\d{3})+)/); if(m)return parseInt(m[1].replace(/[.,]/g,''),10);
  m=t.match(/\b(\d{4,})\b/); if(m)return parseInt(m[1],10); return 0;}
function parseTipe(text){const t=' '+text.toLowerCase()+' ';
  const masuk=['masuk','terima','diterima','pelunasan','dilunasi','pembayaran dari','transfer dari','tf dari','dari klien','settlement','pemasukan','omzet','dibayar klien'];
  const keluar=['bayar','beli','top up','topup','spend','biaya','gaji','fee','komisi','langganan','sewa','keluar','pengeluaran','reimburse'];
  for(const k of masuk)if(t.includes(' '+k))return'masuk';
  for(const k of keluar)if(t.includes(' '+k))return'keluar'; return'keluar';}
function parseKategori(text,tipe){const t=text.toLowerCase();
  const map=tipe==='masuk'
    ?[[/retainer|bulanan|maintenance/,'Retainer klien'],[/project|proyek|paket/,'Project fee'],
      [/budget|titip/,'Ads budget titipan'],[/bonus|insentif/,'Bonus/insentif']]
    :[[/iklan|ads|meta|facebook|\bfb\b|tiktok|shopee|google/,'Ads spend'],
      [/gaji|payroll|thr|fee tim|freelance/,'Gaji & fee tim'],
      [/kol|affiliate|afiliasi|endorse|host live/,'Komisi KOL/affiliate'],
      [/langganan|subscription|canva|figma|domain|hosting|tools/,'Tools & langganan'],
      [/listrik|internet|wifi|sewa|kantor|atk|parkir|bensin|transport|makan/,'Operasional kantor'],
      [/konten|shooting|foto|video|talent|studio/,'Produksi konten'],
      [/prive|setoran founder|bagi hasil founder/,'Prive founder'],
      [/sedekah|donasi|zakat|infaq|infak/,'Sedekah & donasi'],
      [/pajak|pph|ppn/,'Pajak']];
  for(const[re,k]of map)if(re.test(t))return k; return'Lain-lain';}
function parseKlien(text){const t=text.toLowerCase();let best=null;
  state.klien.forEach(k=>{const n=k.nama.toLowerCase();
    if(t.includes(n)){if(!best||n.length>best.nama.length)best=k;return;}
    const f=n.split(' ')[0]; if(f.length>3&&t.includes(f)&&!best)best=k;});
  return best;}
function parseTanggal(text){const t=text.toLowerCase();
  if(/kemarin/.test(t)){const d=new Date();d.setDate(d.getDate()-1);return d.toISOString().slice(0,10);}
  const B={januari:1,februari:2,maret:3,april:4,mei:5,juni:6,juli:7,agustus:8,september:9,oktober:10,november:11,desember:12,
           jan:1,feb:2,mar:3,apr:4,jun:6,jul:7,agu:8,sep:9,okt:10,nov:11,des:12};
  const m=t.match(/\b(\d{1,2})\s+([a-z]{3,9})\b/);
  if(m&&B[m[2]])return `${new Date().getFullYear()}-${String(B[m[2]]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;
  const iso=t.match(/\b\d{4}-\d{2}-\d{2}\b/); return iso?iso[0]:todayISO();}
function parseOffline(text){const tipe=parseTipe(text);const k=parseKlien(text);
  return{tipe,nominal:parseNominal(text),kategori:parseKategori(text,tipe),klienId:k?k.id:'',
    tanggal:parseTanggal(text),keterangan:text.trim().slice(0,120),
    metode:/cash|tunai/.test(text.toLowerCase())?'Cash':'Transfer bank',sumber:'offline'};}

function jawabPertanyaan(text){const t=text.toLowerCase(); if(!t)return null;
  if(/saldo|kas sekarang|uang kita/.test(t))
    return `Saldo kas ${rp(saldo())}.\nBulan ini masuk ${rp(totalTipe(trxBulan(bulanIni()),'masuk'))}, keluar ${rp(totalTipe(trxBulan(bulanIni()),'keluar'))}.`;
  if(/belum bayar|piutang|nunggak|telat|tagihan/.test(t)){const l=tagihanTerbuka();
    if(!l.length)return 'Tidak ada tagihan terbuka. Semua klien lunas.';
    return `${l.length} tagihan terbuka, total ${rp(totalPiutang())}:\n`+
      l.slice(0,8).map(i=>`• ${i.klien} — ${rp(i.sisa)} (${statusInv(i).t})`).join('\n');}
  if(/laporan|rekap|ringkasan/.test(t)){const a=trxBulan(bulanIni());
    const m=totalTipe(a,'masuk'),k=totalTipe(a,'keluar'),pk={};
    a.filter(x=>x.tipe==='keluar').forEach(x=>pk[x.kategori]=(pk[x.kategori]||0)+x.nominal);
    const top=Object.entries(pk).sort((x,y)=>y[1]-x[1]).slice(0,4).map(([k2,v])=>`• ${k2}: ${rp(v)}`).join('\n');
    return `${bulanLabel(bulanIni())}\nMasuk ${rp(m)}\nKeluar ${rp(k)}\nSelisih ${rp(m-k)}${top?'\n\nPengeluaran terbesar:\n'+top:''}`;}
  return null;}

function autoPotongTagihan(t,silent){
  const k=state.klien.find(x=>x.id===t.klienId); if(!k)return;
  const inv=(k.tagihan||[]).filter(i=>(i.nominal-(i.dibayar||0))>0)
    .sort((a,b)=>(a.jatuhTempo||'').localeCompare(b.jatuhTempo||''))[0];
  if(!inv){if(!silent)toast('Tidak ada tagihan terbuka');return;}
  const sisa=inv.nominal-(inv.dibayar||0), bayar=Math.min(sisa,t.nominal);
  inv.dibayar=(inv.dibayar||0)+bayar; inv.trxIds=(inv.trxIds||[]).concat(t.id);
  state.chat.push({role:'ai',text:`Tagihan ${k.nama} ${inv.periode} dipotong ${rp(bayar)} → ${
    (inv.nominal-inv.dibayar)<=0?'Lunas':'sisa '+rp(inv.nominal-inv.dibayar)}.`});
  persist(); render(); renderChat();}
function terapkanKeTagihan(id){const t=state.transaksi.find(x=>x.id===id);if(t)autoPotongTagihan(t,false);}

function compressImage(file,max){max=max||1100;
  return new Promise(res=>{const fr=new FileReader();
    fr.onload=()=>{const img=new Image();
      img.onload=()=>{const sc=Math.min(1,max/Math.max(img.width,img.height));
        const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        const u=c.toDataURL('image/jpeg',0.72);
        res({dataUrl:u,base64:u.split(',')[1],mediaType:'image/jpeg',name:file.name,type:file.type});};
      img.onerror=()=>res({dataUrl:fr.result,base64:String(fr.result).split(',')[1],mediaType:file.type,name:file.name,type:file.type});
      img.src=fr.result;};
    fr.readAsDataURL(file);});}

function setMode(m){
  state.periode.mode=m;
  if(m==='bulan'&&!state.periode.ym)state.periode.ym=bulanIni();
  if(m==='tahun'&&!state.periode.tahun)state.periode.tahun=todayISO().slice(0,4);
  persist();render();
}
function geserPeriode(n){
  const p=state.periode;
  if(p.mode==='bulan'){const[y,m]=p.ym.split('-').map(Number);
    const d=new Date(y,m-1+n,1);p.ym=d.toISOString().slice(0,7);}
  else if(p.mode==='tahun')p.tahun=String(+p.tahun+n);
  persist();render();
}
function keSekarang(){
  state.periode.ym=bulanIni();state.periode.tahun=todayISO().slice(0,4);
  persist();render();
}
function periodeLabel(){
  const p=state.periode;
  return p.mode==='bulan'?bulanLabel(p.ym):p.mode==='tahun'?'Tahun '+p.tahun:'Sepanjang pencatatan';
}
function periodePrefix(){
  const p=state.periode;
  return p.mode==='bulan'?p.ym:p.mode==='tahun'?p.tahun:'';
}
const dalamPeriode=iso=>(iso||'').startsWith(periodePrefix());
const trxPeriode=()=>state.transaksi.filter(t=>dalamPeriode(t.tanggal));
function periodeSebelum(){
  const p=state.periode;
  if(p.mode==='bulan'){const[y,m]=p.ym.split('-').map(Number);
    return new Date(y,m-2,1).toISOString().slice(0,7);}
  if(p.mode==='tahun')return String(+p.tahun-1);
  return null;
}
const trxBanding=()=>{const pre=periodeSebelum();
  return pre?state.transaksi.filter(t=>(t.tanggal||'').startsWith(pre)):[];};
const labelBanding=()=>{const pre=periodeSebelum();
  return !pre?'':state.periode.mode==='bulan'?bulanLabel(pre):'Tahun '+pre;};
/* patokan bulan untuk nilai aset: akhir periode aktif */

  const p=state.periode;

let fTipe='',fKat='',fKlien='',fCari='';
function vTransaksi(){
  const tab=state.tab.transaksi||'semua';
  let arr=trxPeriode();
  if(tab==='masuk')arr=arr.filter(t=>t.tipe==='masuk');
  if(tab==='keluar')arr=arr.filter(t=>t.tipe==='keluar');
  if(tab==='bukti')arr=arr.filter(t=>!t.bukti);
  if(fTipe)arr=arr.filter(t=>t.tipe===fTipe);
  if(fKat)arr=arr.filter(t=>t.kategori===fKat);
  if(fKlien)arr=arr.filter(t=>t.klienId===fKlien);
  if(fCari)arr=arr.filter(t=>(t.keterangan||'').toLowerCase().includes(fCari.toLowerCase()));
  arr.sort((a,b)=>(b.tanggal||'').localeCompare(a.tanggal||''));
  const per=trxPeriode();
  const m=totalTipe(arr,'masuk'),k=totalTipe(arr,'keluar');
  const tanpaBukti=per.filter(t=>!t.bukti).length;

  return heroHTML('Buku Transaksi',
    `${periodeLabel()} · Masuk <b>${rp(totalTipe(per,'masuk'))}</b> · Keluar <b>${rp(totalTipe(per,'keluar'))}</b> · ${per.length} baris`,

     <button class="btn on-hero" onclick="unduhCSV()">Unduh CSV</button>`)

  +tabs([['semua','Semua',per.length],['masuk','Masuk',per.filter(t=>t.tipe==='masuk').length],
         ['keluar','Keluar',per.filter(t=>t.tipe==='keluar').length],
         ['bukti','Tanpa Bukti',tanpaBukti||'']],tab,'setTabTrx')
  +`<section>

function blokKontribusi(){
  const perKlien={};
  const arr=state.periode.mode==='semua'?state.transaksi:trxPeriode();
  arr.filter(t=>t.tipe==='masuk'&&t.klienId&&t.kategori!=='Ads budget titipan')
    .forEach(t=>perKlien[t.klienId]=(perKlien[t.klienId]||0)+t.nominal);
  const rank=Object.entries(perKlien).sort((a,b)=>b[1]-a[1]);
  const tot=rank.reduce((s,r)=>s+r[1],0)||1;
  return barPeriode()+`<section>
    ${sec('bar','green','Kontribusi Pendapatan','Pemasukan atas nama tiap klien di '+periodeLabel().toLowerCase()+', tanpa dana titipan iklan.')}
    ${rank.length?`<table>
      <thead><tr><th>Klien</th><th class="r">Pendapatan</th><th class="r">Porsi</th><th class="r">Piutang</th><th>Status</th></tr></thead>
      <tbody>${rank.map(([id,v])=>{const k=state.klien.find(x=>x.id===id);
        const p=tagihanTerbuka().filter(i=>i.klienId===id).reduce((s,i)=>s+i.sisa,0);
        const adaTelat=telat().some(i=>i.klienId===id);
        return`<tr><td class="name">${k?esc(k.nama):'(terhapus)'}</td>
          <td class="r num">${rp(v)}</td><td class="r num">${(v/tot*100).toFixed(1)}%</td>
          <td class="r num" style="color:${p>0?'var(--red)':'var(--muted)'}">${rp(p)}</td>
          <td><span class="pill ${adaTelat?'p-red':p>0?'p-amber':'p-green'}">${adaTelat?'Menunggak':p>0?'Ada tagihan':'Lancar'}</span></td></tr>`}).join('')}
      </tbody><tfoot><tr><td>Total</td><td class="r num">${rp(tot)}</td><td colspan="3"></td></tr></tfoot></table>
      ${rank.length&&(rank[0][1]/tot)>0.5?`<div class="ins warn" style="margin-top:16px"><h4>Ketergantungan pada satu klien</h4>
        <p><b>${esc(state.klien.find(x=>x.id===rank[0][0])?.nama||'')}</b> menyumbang ${(rank[0][1]/tot*100).toFixed(0)}% pendapatan periode ini. Kalau kontrak itu berhenti, dampaknya besar ke kas ARL.</p></div>`:''}`
    :`<div class="empty"><b>Belum ada pemasukan bertanda klien</b>Tandai transaksi masuk ke nama klien supaya kontribusinya terlihat.</div>`}
  </section>`;
}

function pajakTabTahunan(){

  const bebanSemua=trxThn.filter(t=>t.tipe==='keluar').reduce((s,t)=>s+t.nominal,0);
  const prive=trxThn.filter(t=>t.tipe==='keluar'&&BUKAN_BEBAN.includes(t.kategori)).reduce((s,t)=>s+t.nominal,0);
  const koreksi=trxThn.filter(t=>t.tipe==='keluar'&&KOREKSI_FISKAL.includes(t.kategori)

function lapLabaRugi(){
  const arr=trxPeriode();
  const pend={},beb={};
  let prive=0;
  arr.forEach(t=>{if(t.tipe==='masuk'){if(t.kategori==='Ads budget titipan')return;
    pend[t.kategori]=(pend[t.kategori]||0)+t.nominal;}
    else if(BUKAN_BEBAN.includes(t.kategori))prive+=t.nominal;
    else beb[t.kategori]=(beb[t.kategori]||0)+t.nominal;});
  const bulanDalamPeriode=state.periode.mode==='tahun'?12:state.periode.mode==='bulan'?1:
    Math.max(1,new Set(state.transaksi.map(t=>(t.tanggal||'').slice(0,7))).size);
  const susut=asetTetap().reduce((s,a)=>s+susutBulanan(a),0)*bulanDalamPeriode;
  const totalP=Object.values(pend).reduce((a,b)=>a+b,0);
  const totalB=Object.values(beb).reduce((a,b)=>a+b,0)+susut;
  const laba=totalP-totalB;
  return `<section>
    ${sec('bar','green','Laba Rugi '+periodeLabel(),'Pendapatan jasa dikurangi beban operasional dan penyusutan.')}
    <table><tbody>
      <tr><td colspan="2" style="background:#F5F7FA"><b>Pendapatan</b></td></tr>
      ${Object.entries(pend).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td style="padding-left:20px">${esc(k)}</td>
        <td class="r num">${rp(v)}</td></tr>`).join('')||'<tr><td style="padding-left:20px" class="cell-sub">Belum ada</td><td class="r num">Rp 0</td></tr>'}
      <tr><td><b>Total pendapatan</b></td><td class="r num"><b>${rp(totalP)}</b></td></tr>
      <tr><td colspan="2" style="background:#F5F7FA"><b>Beban</b></td></tr>

function lapArusKas(){
  const byM={};
  state.transaksi.forEach(t=>{const m=(t.tanggal||'').slice(0,7);if(!m)return;
    if(state.periode.mode==='tahun'&&!m.startsWith(state.periode.tahun))return;
    byM[m]=byM[m]||{masuk:0,keluar:0};byM[m][t.tipe]+=t.nominal;});
  const months=Object.keys(byM).sort().reverse();
  const tM=months.reduce((s,m)=>s+byM[m].masuk,0),tK=months.reduce((s,m)=>s+byM[m].keluar,0);
  return `<section>
    ${sec('bar','','Arus Kas per Bulan',state.periode.mode==='tahun'?'Sepanjang '+periodeLabel().toLowerCase()+'.':'Seluruh bulan tercatat. Ganti ke Per Tahun untuk menyaring satu tahun saja.')}
    ${months.length?`<table>
      <thead><tr><th>Bulan</th><th class="r">Masuk</th><th class="r">Keluar</th><th class="r">Selisih</th><th>Status</th></tr></thead>
      <tbody>${months.map(m=>{const d=byM[m],s=d.masuk-d.keluar;return`<tr>
        <td class="name">${bulanLabel(m)}</td>
        <td class="r num" style="color:var(--green)">${rp(d.masuk)}</td>
        <td class="r num" style="color:var(--red)">${rp(d.keluar)}</td>
        <td class="r num"><b>${rp(s)}</b></td>
        <td><span class="pill ${s>=0?'p-green':'p-red'}">${s>=0?'Surplus':'Defisit'}</span></td></tr>`}).join('')}
      </tbody><tfoot><tr><td>Total</td><td class="r num">${rp(tM)}</td><td class="r num">${rp(tK)}</td>
        <td class="r num">${rp(tM-tK)}</td><td></td></tr></tfoot></table>`
    :`<div class="empty"><b>Belum ada data</b>Catat transaksi dulu.</div>`}
  </section>`;
}
function lapKategori(){
  const arr=trxPeriode();
  const kat={};
  arr.forEach(t=>{const key=t.kategori;kat[key]=kat[key]||{masuk:0,keluar:0,n:0};
    kat[key][t.tipe]+=t.nominal;kat[key].n++;});
  const rows=Object.entries(kat).sort((a,b)=>(b[1].masuk+b[1].keluar)-(a[1].masuk+a[1].keluar));
  const totK=rows.reduce((s,r)=>s+r[1].keluar,0)||1;
  return `<section>
    ${sec('grid','','Rincian per Kategori',periodeLabel()+' — dipakai untuk melihat pos mana yang paling menyedot kas.')}
    ${rows.length?`<table>
      <thead><tr><th>Kategori</th><th class="r">Transaksi</th><th class="r">Masuk</th><th class="r">Keluar</th><th class="r">Porsi Beban</th></tr></thead>
      <tbody>${rows.map(([k,v])=>`<tr>
        <td class="name">${esc(k)}</td><td class="r num">${v.n}</td>
        <td class="r num" style="color:${v.masuk?'var(--green)':'var(--muted)'}">${v.masuk?rp(v.masuk):'—'}</td>
        <td class="r num" style="color:${v.keluar?'var(--red)':'var(--muted)'}">${v.keluar?rp(v.keluar):'—'}</td>
        <td class="r num">${v.keluar?(v.keluar/totK*100).toFixed(1)+'%':'—'}</td></tr>`).join('')}
      </tbody></table>`
    :`<div class="empty"><b>Tidak ada transaksi</b>Pilih periode lain.</div>`}
  </section>`;
}

Saya dari Arah Ruang Langit. Mengingatkan tagihan ${k.paket||'layanan'} berikut:

${rincian}

Total ${rp(total)}. Kalau invoice atau rekap performanya perlu dikirim ulang, saya siapkan hari ini.

Terima kasih banyak.`;
  if(nada==='menagih')return `${sapa}

Menindaklanjuti tagihan ${k.paket||'layanan'} yang sudah melewati jatuh tempo:

${rincian}

Total ${rp(total)}. Boleh dibantu info perkiraan tanggal pembayarannya, supaya kami bisa mengatur jadwal pengerjaan bulan berjalan?

Terima kasih.`;
  return `${sapa}

Tagihan ${k.paket||'layanan'} berikut sudah telat ${Math.abs(d)} hari:

${rincian}

Total ${rp(total)}. Mohon konfirmasi tanggal pembayarannya. Bila sampai akhir pekan ini belum ada kabar, kami perlu menahan sementara pengerjaan bulan berjalan.

Terima kasih atas perhatiannya.`;}

function unduhCSV(){
  const rows=[['tanggal','tipe','keterangan','kategori','klien','metode','nominal','ada_bukti']];
  state.transaksi.slice().sort((a,b)=>(a.tanggal||'').localeCompare(b.tanggal||'')).forEach(t=>{
    const k=state.klien.find(x=>x.id===t.klienId);
    rows.push([t.tanggal,t.tipe,t.keterangan,t.kategori,k?k.nama:'',t.metode,t.nominal,t.bukti?'ya':'tidak']);});
  const csv=rows.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  unduh(new Blob(['\uFEFF'+csv],{type:'text/csv'}),`arl-transaksi-${todayISO()}.csv`);}
function unduh(blob,nama){const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=nama;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);}

/* ---------- helper aset ---------- */
function bulanJalan(a,sampaiYM){
  if(!a.tglPerolehan)return 0;
  const [y1,m1]=a.tglPerolehan.slice(0,7).split('-').map(Number);
  const [y2,m2]=(sampaiYM||bulanIni()).split('-').map(Number);
  let n=(y2-y1)*12+(m2-m1)+1;                       // penyusutan mulai bulan perolehan
  const maks=(KELOMPOK[a.kelompok]?.th||4)*12;
  if(a.status==='Dilepas'&&a.tglLepas){
    const [y3,m3]=a.tglLepas.slice(0,7).split('-').map(Number);
    n=Math.min(n,(y3-y1)*12+(m3-m1)+1);
  }
  return Math.max(0,Math.min(n,maks));
}
function susutBulanan(a){
  const K=KELOMPOK[a.kelompok]; if(!K||a.jenisAset==='inventaris')return 0;
  const dasar=Math.max(0,(a.hargaPerolehan||0)-(a.nilaiResidu||0));
  if(a.metode==='saldo_menurun'&&K.sm)return Math.round(dasar*K.sm/12); // pendekatan rata bulanan
  return Math.round(dasar/(K.th*12));
}
function akumulasi(a,ym){
  if(a.jenisAset==='inventaris')return 0;
  const dasar=Math.max(0,(a.hargaPerolehan||0)-(a.nilaiResidu||0));
  return Math.min(dasar,susutBulanan(a)*bulanJalan(a,ym));
}
const nilaiBuku=(a,ym)=>a.jenisAset==='inventaris'?0:Math.max(a.nilaiResidu||0,(a.hargaPerolehan||0)-akumulasi(a,ym));
const asetAktif=()=>state.aset.filter(a=>a.status!=='Dilepas'&&a.status!=='Hilang');
const asetTetap=()=>asetAktif().filter(a=>a.jenisAset!=='inventaris');
const totalPerolehan=()=>asetTetap().reduce((s,a)=>s+(a.hargaPerolehan||0),0);
const totalAkumulasi=(ym)=>asetTetap().reduce((s,a)=>s+akumulasi(a,ym),0);
const totalNilaiBuku=(ym)=>asetTetap().reduce((s,a)=>s+nilaiBuku(a,ym),0);
const susutBulanIni=()=>asetTetap().filter(a=>bulanJalan(a)>0&&bulanJalan(a)<(KELOMPOK[a.kelompok]?.th||4)*12+1)
  .reduce((s,a)=>s+susutBulanan(a),0);

/* ---------- helper rekening ---------- */
function saldoRekening(id){
  const r=state.rekening.find(x=>x.id===id); if(!r)return 0;
  return (r.saldoAwal||0)+state.transaksi.filter(t=>t.rekeningId===id)
    .reduce((s,t)=>s+(t.tipe==='masuk'?t.nominal:-t.nominal),0);
}
const totalKas=()=>state.rekening.reduce((s,r)=>s+saldoRekening(r.id),0)
  + state.transaksi.filter(t=>!t.rekeningId).reduce((s,t)=>s+(t.tipe==='masuk'?t.nominal:-t.nominal),0);

function utangTerbuka(){
  const o=[];
  state.vendor.forEach(v=>(v.utang||[]).forEach(u=>{
    const s=u.nominal-(u.dibayar||0); if(s>0)o.push({...u,sisa:s,vendorId:v.id,vendor:v.nama,jenis:v.jenis});}));
  return o.sort((a,b)=>(a.jatuhTempo||'').localeCompare(b.jatuhTempo||''));
}
const totalUtang=()=>utangTerbuka().reduce((s,u)=>s+u.sisa,0);

/* ---------- helper pajak ---------- */
function deadlineSetor(periode){const[y,m]=periode.split('-').map(Number);
  return new Date(y,m,15).toISOString().slice(0,10);}
function deadlineLapor(periode,jenis){const[y,m]=periode.split('-').map(Number);
  const L=JENIS_PAJAK[jenis]?.lapor;
  if(!L)return null;
  if(L==='akhir')return new Date(y,m+1,0).toISOString().slice(0,10);
  return new Date(y,m,L).toISOString().slice(0,10);}

/* ---------- laba rugi ---------- */
function labaRugi(ym){
  const arr=ym?trxBulan(ym):state.transaksi;
  const pendapatan={},beban={};
  arr.forEach(t=>{
    if(t.tipe==='masuk'){
      if(t.kategori==='Ads budget titipan')return;      // titipan klien = liabilitas
      pendapatan[t.kategori]=(pendapatan[t.kategori]||0)+t.nominal;
    }else beban[t.kategori]=(beban[t.kategori]||0)+t.nominal;
  });
  const totalP=Object.values(pendapatan).reduce((a,b)=>a+b,0);
  const penyusutan=ym?susutBulanIni():totalAkumulasi();
  const totalB=Object.values(beban).reduce((a,b)=>a+b,0)+penyusutan;
  return {pendapatan,beban,penyusutan,totalP,totalB,laba:totalP-totalB};
}
/* PPh badan 22% dengan fasilitas Pasal 31E */
function pphBadan(labaSetahun,omzetSetahun){
  if(labaSetahun<=0)return 0;
  if(omzetSetahun<=4.8e9)return Math.round(labaSetahun*.22*.5);
  if(omzetSetahun<50e9){
    const bagianFasilitas=labaSetahun*(4.8e9/omzetSetahun);
    return Math.round(bagianFasilitas*.22*.5+(labaSetahun-bagianFasilitas)*.22);
  }
  return Math.round(labaSetahun*.22);
}

/* ---------- provider: Gemini ---------- */
async function geminiModelTersedia(key){
  const r=await fetch(`${GEMINI_BASE}/models?key=${encodeURIComponent(key)}`);
  if(!r.ok)throw new Error('Kunci API ditolak ('+r.status+')');
  const d=await r.json();
  const ada=(d.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent'))
    .map(m=>m.name.replace('models/',''));
  for(const p of GEMINI_PILIHAN) if(ada.includes(p)) return p;
  const flash=ada.find(m=>/flash/.test(m)&&!/image|tts|live|embedding/.test(m));
  return flash||ada[0];
}
async function panggilGemini(teks,file,sistem){
  const key=state.ai.geminiKey;
  if(!key)throw new Error('Kunci API Gemini belum diisi');
  let model=state.ai.geminiModel;
  if(!model){model=await geminiModelTersedia(key);state.ai.geminiModel=model;persist();}
  const parts=[];
  if(file&&file.type.startsWith('image/'))
    parts.push({inline_data:{mime_type:file.mediaType,data:file.base64}});
  parts.push({text:teks||'Ekstrak transaksi dari bukti ini.'});
  const r=await fetch(`${GEMINI_BASE}/models/${model}:generateContent?key=${encodeURIComponent(key)}`,{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      system_instruction:{parts:[{text:sistem}]},
      contents:[{role:'user',parts}],
      generationConfig:{temperature:0.1,response_mime_type:'application/json',maxOutputTokens:2048}
    })});
  if(!r.ok){
    const e=await r.text();
    if(r.status===429)throw new Error('Kuota Gemini habis untuk sekarang. Tunggu sebentar atau ganti ke mode offline.');
    throw new Error('Gemini '+r.status+' — '+e.slice(0,120));
  }
  const d=await r.json();
  return (d.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('');
}

/* ---------- provider: Claude ---------- */
async function panggilClaude(teks,file,sistem){
  const content=[];
  if(file&&file.type.startsWith('image/'))
    content.push({type:'image',source:{type:'base64',media_type:file.mediaType,data:file.base64}});
  content.push({type:'text',text:teks||'Ekstrak transaksi dari bukti ini.'});
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:AI_MODEL,max_tokens:2000,system:sistem,messages:[{role:'user',content}]})});
  if(!r.ok)throw new Error('Claude '+r.status);
  const d=await r.json();
  return (d.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
}

function ambilJSON(raw){
  const t=raw.replace(/```json|```/g,'').trim();
  const a=t.indexOf('{'),b=t.lastIndexOf('}');
  if(a<0||b<0)throw new Error('Balasan bukan JSON');
  return JSON.parse(t.slice(a,b+1));
}

async function otakAI(teks,file){
  const sistem=instruksiSistem();
  const p=state.ai.provider;
  if(p==='gemini')return ambilJSON(await panggilGemini(teks,file,sistem));
  if(p==='claude')return ambilJSON(await panggilClaude(teks,file,sistem));
  throw new Error('offline');
}

function skorCocok(kueri,target){
  const a=(kueri||'').toLowerCase().trim(),b=(target||'').toLowerCase().trim();
  if(!a||!b)return 0;
  if(a===b)return 100;
  if(b.includes(a)||a.includes(b))return 80-Math.abs(a.length-b.length);
  const ka=a.split(/\s+/),kb=b.split(/\s+/);
  let n=0; ka.forEach(x=>{if(x.length>2&&kb.some(y=>y.startsWith(x)||x.startsWith(y)))n++;});
  return n?40+n*10:0;
}
function cariSatu(arr,kueri,field){
  if(!kueri)return null;
  let best=null,bs=0;
  arr.forEach(o=>{const s=skorCocok(kueri,o[field||'nama']);if(s>bs){bs=s;best=o;}});
  return bs>=40?best:null;
}
function cariTransaksi(kueri){
  if(!kueri)return null;
  let best=null,bs=0;
  state.transaksi.forEach(t=>{
    const s=Math.max(skorCocok(kueri,t.keterangan),skorCocok(kueri,t.kategori));
    if(s>bs){bs=s;best=t;}});
  return bs>=40?best:null;
}
const angkaBulat=v=>Math.max(0,Math.round(+v||0));
const tglValid=v=>/^\d{4}-\d{2}-\d{2}$/.test(v||'')?v:todayISO();

/* =========================================================
   EKSEKUSI AKSI
   ========================================================= */
function jalankanAksi(aksi){
  const log=[];
  (aksi||[]).forEach(a=>{
    const nama=a.aksi||a.jenis_aksi;
    try{ if(!EKSEKUTOR[nama]){log.push({ok:false,teks:'Aksi tidak dikenali: '+nama});return;}
      const r=EKSEKUTOR[nama](a); if(r)log.push(r);
    }catch(e){ log.push({ok:false,teks:'Gagal: '+(e.message||nama)}); }
  });
  return log;
}

const EKSEKUTOR={
  transaksi_baru(a){
    const k=cariSatu(state.klien,a.klien);
    const r=cariSatu(state.rekening,a.rekening)||state.rekening[0];
    const tipe=a.tipe==='masuk'?'masuk':'keluar';
    const kats=tipe==='masuk'?KATEGORI_MASUK:KATEGORI_KELUAR;
    const t={id:uid(),tipe,nominal:angkaBulat(a.nominal),
      kategori:kats.includes(a.kategori)?a.kategori:'Lain-lain',
      klienId:k?k.id:'',rekeningId:r?r.id:'',tanggal:tglValid(a.tanggal),
      keterangan:(a.keterangan||'Transaksi').slice(0,120),
      metode:a.metode||'Transfer bank',bukti:null,sumber:'ai',dibuat:new Date().toISOString()};

  },
  transaksi_ubah(a){
    const t=cariTransaksi(a.cari);
    if(!t)return{ok:false,teks:`Transaksi "${a.cari}" tidak ketemu`};
    const sblm=rp(t.nominal);
    if(a.nominal!=null)t.nominal=angkaBulat(a.nominal);
    if(a.tanggal)t.tanggal=tglValid(a.tanggal);
    if(a.kategori)t.kategori=a.kategori;

  },
  transaksi_hapus(a){
    const t=cariTransaksi(a.cari);
    if(!t)return{ok:false,teks:`Transaksi "${a.cari}" tidak ketemu`};
    state.transaksi=state.transaksi.filter(x=>x.id!==t.id);
    return{ok:true,teks:`Dihapus: ${t.keterangan} ${rp(t.nominal)}`};
  },
  tagihan_lunas(a){
    const k=cariSatu(state.klien,a.klien);
    if(!k)return{ok:false,teks:`Klien "${a.klien}" belum terdaftar`};
    let inv=(k.tagihan||[]).filter(i=>i.nominal-(i.dibayar||0)>0);
    if(a.periode){const p=inv.find(i=>skorCocok(a.periode,i.periode)>=40);if(p)inv=[p];}
    if(!inv.length)return{ok:false,teks:`${k.nama} tidak punya tagihan terbuka`};
    inv.sort((x,y)=>(x.jatuhTempo||'').localeCompare(y.jatuhTempo||''));
    let sisaBayar=a.nominal!=null?angkaBulat(a.nominal):inv.reduce((s,i)=>s+(i.nominal-(i.dibayar||0)),0);
    const total=sisaBayar; const kena=[];
    for(const i of inv){
      if(sisaBayar<=0)break;
      const sisa=i.nominal-(i.dibayar||0), bayar=Math.min(sisa,sisaBayar);
      i.dibayar=(i.dibayar||0)+bayar; sisaBayar-=bayar;
      kena.push(`${i.periode} ${rp(bayar)}${(i.nominal-i.dibayar)>0?' (sisa '+rp(i.nominal-i.dibayar)+')':' — lunas'}`);
    }
    let trxId=null;
    if(a.catatTransaksi!==false&&total>0){

      const t={id:uid(),tipe:'masuk',nominal:total,kategori:'Retainer klien',klienId:k.id,

        metode:'Transfer bank',bukti:null,sumber:'ai',dibuat:new Date().toISOString()};
      state.transaksi.unshift(t); trxId=t.id;
    }
    return{ok:true,trxId,teks:`${k.nama} dibayar ${rp(total)} → ${kena.join(', ')}`};
  },
  tagihan_baru(a){
    const k=cariSatu(state.klien,a.klien);

  },
  klien_baru(a){
    if(cariSatu(state.klien,a.nama))return{ok:false,teks:`Klien "${a.nama}" sudah ada`};
    state.klien.push({id:uid(),nama:a.nama,pic:a.pic||'',wa:(a.wa||'').replace(/\D/g,''),
      paket:a.paket||'',nilai:angkaBulat(a.nilai),tanggalTagih:a.tanggalTagih||1,
      tempoHari:a.tempoHari??7,catatan:'',tagihan:[]});
    return{ok:true,teks:`Klien baru: ${a.nama}`};
  },
  klien_ubah(a){
    const k=cariSatu(state.klien,a.nama);
    if(!k)return{ok:false,teks:`Klien "${a.nama}" tidak ketemu`};
    ['pic','paket'].forEach(f=>{if(a[f])k[f]=a[f];});

    if(a.nilai!=null)k.nilai=angkaBulat(a.nilai);

  },
  vendor_baru(a){
    if(cariSatu(state.vendor,a.nama))return{ok:false,teks:`Vendor "${a.nama}" sudah ada`};
    state.vendor.push({id:uid(),nama:a.nama,jenis:a.jenis||'Lain-lain',
      wa:(a.wa||'').replace(/\D/g,''),npwp:!!a.npwp,catatan:'',utang:[]});
    return{ok:true,teks:`Vendor baru: ${a.nama}`};
  },
  utang_baru(a){
    let v=cariSatu(state.vendor,a.vendor);
    if(!v){v={id:uid(),nama:a.vendor,jenis:'Lain-lain',wa:'',npwp:false,catatan:'',utang:[]};state.vendor.push(v);}
    v.utang=v.utang||[];
    v.utang.push({id:uid(),keterangan:a.keterangan||'Tagihan',nominal:angkaBulat(a.nominal),
      dibayar:0,jatuhTempo:tglValid(a.jatuhTempo),catatan:''});
    return{ok:true,teks:`Utang ke ${v.nama} ${rp(angkaBulat(a.nominal))} dicatat`};
  },
  utang_bayar(a){
    const v=cariSatu(state.vendor,a.vendor);

    const buka=(v.utang||[]).filter(u=>u.nominal-(u.dibayar||0)>0)

    let sisaBayar=a.nominal!=null?angkaBulat(a.nominal):buka.reduce((s,u)=>s+(u.nominal-(u.dibayar||0)),0);
    const total=sisaBayar;
    for(const u of buka){ if(sisaBayar<=0)break;
      const s=u.nominal-(u.dibayar||0),b=Math.min(s,sisaBayar); u.dibayar=(u.dibayar||0)+b; sisaBayar-=b; }
    let trxId=null;

      bank:a.bank||'',noRek:'',saldoAwal:angkaBulat(a.saldoAwal),catatan:''});

/* =========================================================
   FALLBACK OFFLINE — juga bisa aksi sederhana
   ========================================================= */
function otakOffline(teks){
  const t=(teks||'').toLowerCase();
  const q=jawabPertanyaan(teks);
  if(q)return{balas:q,aksi:[]};

  // "klien X sudah bayar"
  if(/(sudah|udah|sdh|telah)\s*(bayar|transfer|tf|lunas|melunasi)|lunas|pelunasan/.test(t)){
    const k=state.klien.find(x=>x.nama.toLowerCase().split(/\s+/)
      .some(w=>w.length>3&&t.includes(w)))||state.klien.find(x=>t.includes(x.nama.toLowerCase()));
    if(k){const n=parseNominal(teks);
      return{balas:`Menandai pembayaran ${k.nama}.`,
        aksi:[{aksi:'tagihan_lunas',klien:k.nama,nominal:n||null,tanggal:parseTanggal(teks)}]};}
  }
  // pembayaran vendor — cocokkan tiap kata dalam nama vendor
  if(/bayar|lunasi|transfer ke|tf ke/.test(t)){
    const v=state.vendor.find(x=>x.nama.toLowerCase().split(/\s+/)
      .some(w=>w.length>3&&t.includes(w)));
    if(v&&(v.utang||[]).some(u=>u.nominal-(u.dibayar||0)>0))
      return{balas:`Mencatat pembayaran ke ${v.nama}.`,
        aksi:[{aksi:'utang_bayar',vendor:v.nama,nominal:parseNominal(teks)||null}]};
  }
  const p=parseOffline(teks);
  const k=p.klienId?state.klien.find(x=>x.id===p.klienId):null;
  return{balas:'Dicatat tanpa AI (mode offline) — mohon cek nominalnya.',
    aksi:[{aksi:'transaksi_baru',tipe:p.tipe,nominal:p.nominal,kategori:p.kategori,
      klien:k?k.nama:null,tanggal:p.tanggal,keterangan:p.keterangan,metode:p.metode}]};
}

let snapshotUndo=null;
function simpanSnapshot(){
  snapshotUndo=JSON.stringify({transaksi:state.transaksi,klien:state.klien,vendor:state.vendor,
    aset:state.aset,pajak:state.pajak,rekening:state.rekening});
}
function batalkanPerubahan(){
  if(!snapshotUndo){toast('Tidak ada yang bisa dibatalkan');return;}
  const s=JSON.parse(snapshotUndo);
  Object.assign(state,s); snapshotUndo=null;
  state.chat.push({role:'ai',text:'Perubahan terakhir dibatalkan.'});
  persist();render();renderChat();toast('Dibatalkan');
}

async function kirimChat(){
  const box=document.getElementById('chatInput');
  const teks=box.value.trim(), file=attach;
  if(!teks&&!file)return;
  box.value=''; box.style.height='auto';
  pushChat({role:'me',text:teks||'(bukti terlampir)',
    thumb:file&&file.type.startsWith('image/')?file.dataUrl:null});
  clearAttach();

  pushChat({role:'ai',text:'Memproses…'});
  let hasil,mode=state.ai.provider;
  try{
    if(mode==='offline')throw new Error('offline');
    hasil=await otakAI(teks,file);
  }catch(e){
    if(mode!=='offline'&&e.message!=='offline'){
      state.chat.pop();
      state.chat.push({role:'ai',text:'AI tidak bisa dihubungi: '+e.message+'\nBeralih ke mode offline untuk pesan ini.'});
      pushChat({role:'ai',text:'Memproses…'});
    }
    hasil=otakOffline(teks);
    mode='offline';
  }
  state.chat.pop();

  simpanSnapshot();
  const log=jalankanAksi(hasil.aksi);

  // lampirkan bukti ke transaksi pertama yang dibuat
  const trxBaru=log.find(l=>l.trxId);
  if(file&&trxBaru){
    const t=state.transaksi.find(x=>x.id===trxBaru.trxId);
    if(t){t.bukti=file.dataUrl;t.buktiNama=file.name;}
  }

  if(hasil.balas)state.chat.push({role:'ai',text:hasil.balas});
  if(log.length)state.chat.push({role:'log',log,mode});
  if(trxBaru)state.chat.push({role:'rec',trxId:trxBaru.trxId});
  persist();render();renderChat();
}

    <button class="btn ghost" onclick="closeModal()">Batal</button>
    <button class="btn" onclick="simpanAI()">Simpan</button></div>`);
  toggleKunciGemini();}
function toggleKunciGemini(){
  const p=document.getElementById('aiProvider').value;
  document.getElementById('barisKunci').style.display=p==='gemini'?'':'none';}
async function ujiAI(){
  const p=document.getElementById('aiProvider').value;
  const el=document.getElementById('ujiHasil');
  el.innerHTML=`<div class="ins"><p>Menguji…</p></div>`;
  if(p==='offline'){el.innerHTML=`<div class="ins good"><h4>Mode offline siap</h4>
    <p>Perintah dibaca dari kata kunci. Bisa mencatat transaksi dan menandai pembayaran klien, tapi tidak bisa membaca bukti transfer.</p></div>`;return;}
  try{
    if(p==='gemini'){
      const key=document.getElementById('aiKey').value.trim();
      if(!key)throw new Error('Kunci API belum diisi');
      const model=await geminiModelTersedia(key);
      state.ai.geminiModel=model;
      el.innerHTML=`<div class="ins good"><h4>Gemini tersambung</h4>
        <p>Model yang dipakai: <b>${esc(model)}</b>. Bisa membaca teks maupun gambar bukti transfer.</p></div>`;
    }else{
      const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({model:AI_MODEL,max_tokens:5,messages:[{role:'user',content:'ok'}]})});
      if(!r.ok)throw new Error('Status '+r.status);
      el.innerHTML=`<div class="ins good"><h4>Claude tersambung</h4><p>Siap dipakai.</p></div>`;
    }
  }catch(e){
    el.innerHTML=`<div class="ins bad"><h4>Belum tersambung</h4><p>${esc(e.message)}</p></div>`;}
}
function simpanAI(){
  state.ai.provider=document.getElementById('aiProvider').value;
  const k=document.getElementById('aiKey')?.value.trim();
  if(k!==undefined&&k!==state.ai.geminiKey){state.ai.geminiKey=k;state.ai.geminiModel='';}
  persist();closeModal();statusAI();renderChat();toast('Pengaturan AI tersimpan');}
function statusAI(){
  const dot=document.getElementById('aiDot'),st=document.getElementById('aiStatus');
  const p=state.ai.provider;
  dot.classList.toggle('off',p==='offline');
  st.textContent=p==='gemini'?(state.ai.geminiKey?'Gemini aktif · bisa mengubah data':'Gemini belum diberi kunci')
    :p==='claude'?'Claude aktif · bisa mengubah data':'Mode offline · kata kunci saja';}

/* =========================================================
   EVENTS
   ========================================================= */
function go(v){view=v;render();}
document.getElementById('nav').addEventListener('click',e=>{
  const b=e.target.closest('button[data-view]');if(b)go(b.dataset.view);});
document.getElementById('btnSend').onclick=kirimChat;
document.getElementById('chatInput').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();kirimChat();}});
document.getElementById('chatInput').addEventListener('input',e=>{
  e.target.style.height='auto';e.target.style.height=Math.min(120,e.target.scrollHeight)+'px';});
document.getElementById('btnAttach').onclick=()=>document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  if(f.size>8e6){toast('Ukuran file maksimal 8 MB');return;}
  attach=f.type.startsWith('image/')?await compressImage(f)
    :await new Promise(res=>{const fr=new FileReader();
      fr.onload=()=>res({dataUrl:fr.result,base64:String(fr.result).split(',')[1],mediaType:f.type,name:f.name,type:f.type});
      fr.readAsDataURL(f);});
  document.getElementById('attachRow').classList.remove('hidden');
  document.getElementById('attachName').textContent=attach.name;
  const th=document.getElementById('attachThumb');
  if(attach.type.startsWith('image/')){th.src=attach.dataUrl;th.classList.remove('hidden');}
  else th.classList.add('hidden');};
document.getElementById('attachRemove').onclick=clearAttach;
document.getElementById('btnClearChat').onclick=()=>{state.chat=[];persist();renderChat();};
document.querySelectorAll('.chat-tips button').forEach(b=>b.onclick=()=>{
  document.getElementById('chatInput').value=b.dataset.tip;kirimChat();});



(async function boot(){
  const s=await store.load();
  if(s){state={transaksi:s.transaksi||[],klien:s.klien||[],chat:s.chat||[],logo:s.logo||null,
      rekening:s.rekening||[],aset:s.aset||[],vendor:s.vendor||[],pajak:s.pajak||[],
      perusahaan:Object.assign({nama:'PT Arah Ruang Langit',npwp:'',pkp:false,
        alamat:'Bandung, Jawa Barat',modalDisetor:0,batasKapitalisasi:5000000},s.perusahaan||{}),
      ai:Object.assign({provider:'offline',geminiKey:'',geminiModel:''},s.ai||{}),
      periode:Object.assign({mode:'bulan',ym:bulanIni(),tahun:todayISO().slice(0,4)},s.periode||{}),
      tab:Object.assign({dashboard:'ikhtisar',transaksi:'semua',klien:'aktif',aset:'tetap',
        pajak:'kewajiban',laporan:'neraca'},s.tab||{})};
    if(!state.periode.ym)state.periode.ym=bulanIni();
    if(!state.periode.tahun)state.periode.tahun=todayISO().slice(0,4);
    paintLogo();render();renderChat();statusAI();}
  else{paintLogo();seed();statusAI();}})();
</script>
